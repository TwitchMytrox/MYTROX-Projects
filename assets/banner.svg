<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#241150"/>
      <stop offset="1" stop-color="#5b1aa8"/>
    </linearGradient>
    <linearGradient id="title" x1="300" y1="120" x2="980" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7b3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <ellipse cx="1050" cy="80" rx="360" ry="260" fill="url(#glow)"/>
  <ellipse cx="180" cy="300" rx="300" ry="220" fill="url(#glow)" opacity="0.6"/>

  <!-- dotted grid accent -->
  <g fill="#8b5cf6" opacity="0.35">
    <g>
      <circle cx="60" cy="60" r="3"/><circle cx="100" cy="60" r="3"/><circle cx="140" cy="60" r="3"/>
      <circle cx="60" cy="100" r="3"/><circle cx="100" cy="100" r="3"/><circle cx="140" cy="100" r="3"/>
      <circle cx="60" cy="140" r="3"/><circle cx="100" cy="140" r="3"/><circle cx="140" cy="140" r="3"/>
    </g>
  </g>

  <!-- floating shapes -->
  <circle cx="1140" cy="240" r="46" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.5"/>
  <rect x="1020" y="48" width="40" height="40" rx="8" fill="none" stroke="#c4b5fd" stroke-width="4" opacity="0.5" transform="rotate(18 1040 68)"/>

  <!-- code bracket accent -->
  <text x="300" y="180" font-family="'Courier New', monospace" font-size="120" fill="#7c3aed" opacity="0.25" text-anchor="end">&lt;/&gt;</text>

  <!-- title -->
  <text x="330" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="#7c3aed" opacity="0.5" filter="url(#soft)">MYTROX-Projects</text>
  <text x="330" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="url(#title)">MYTROX-Projects</text>

  <!-- subtitle -->
  <text x="334" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#c4b5fd">Sammelstelle für alle meine Projekte</text>

  <!-- tag pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="334" y="238" width="118" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="393" y="261" fill="#e9d5ff" text-anchor="middle">Python</text>
    <rect x="462" y="238" width="86" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="505" y="261" fill="#e9d5ff" text-anchor="middle">C++</text>
    <rect x="558" y="238" width="126" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="621" y="261" fill="#e9d5ff" text-anchor="middle">Web / Node</text>
    <rect x="694" y="238" width="104" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="746" y="261" fill="#e9d5ff" text-anchor="middle">Gaming</text>
  </g>
</svg>
